<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 230" width="260" height="230" role="img">
<title>A vertical arrow from (0, 0) down to (0, -32), labeled 32 feet per second squared</title>
<rect width="260" height="230" fill="#fff"/>
<line x1="90" y1="40" x2="90" y2="190" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
<polyline points="84.8,180.3 90,190 95.2,180.3" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="90" cy="40" r="4" fill="#000"/>
<text x="80" y="45" font-family="'Times New Roman', Times, serif" font-size="18" text-anchor="end">(0, 0)</text>
<text x="80" y="200" font-family="'Times New Roman', Times, serif" font-size="18" text-anchor="end">(0, &#8722;32)</text>
<text x="104" y="122" font-family="'Times New Roman', Times, serif" font-size="19">32 ft/sec<tspan dy="-8" font-size="13">2</tspan></text>
</svg>
