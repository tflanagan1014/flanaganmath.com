<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-labelledby="t d">
<title id="t">The domain: the inside of the unit circle</title>
<desc id="d">The xy-plane with the inside of the circle of radius 1 centered at the origin shaded gray. The circle itself is dashed, showing it is not included. The points (1, 0), (0, 1), (minus 1, 0), and (0, minus 1) are marked on the circle.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs>
<circle cx="180" cy="180" r="120" fill="#bdbdbd" stroke="#111" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="20" y1="180" x2="340" y2="180" stroke="#111" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
<line x1="180" y1="340" x2="180" y2="20" stroke="#111" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
<text x="336" y="202" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="20" fill="#111">x</text>
<text x="190" y="30" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="20" fill="#111">y</text>
<circle cx="300" cy="180" r="5" fill="#111"/>
<text x="308" y="170" text-anchor="start" font-family="'Times New Roman', Times, serif" font-size="18" fill="#111">(1, 0)</text>
<circle cx="180" cy="60" r="5" fill="#111"/>
<text x="190" y="52" text-anchor="start" font-family="'Times New Roman', Times, serif" font-size="18" fill="#111">(0, 1)</text>
<circle cx="60" cy="180" r="5" fill="#111"/>
<text x="52" y="170" text-anchor="end" font-family="'Times New Roman', Times, serif" font-size="18" fill="#111">(−1, 0)</text>
<circle cx="180" cy="300" r="5" fill="#111"/>
<text x="190" y="322" text-anchor="start" font-family="'Times New Roman', Times, serif" font-size="18" fill="#111">(0, −1)</text>
</svg>
